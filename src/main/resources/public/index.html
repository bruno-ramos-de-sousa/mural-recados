<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Recados</title>
    <link rel="shortcut icon" href="faviconCoffee.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Mural de Recados</h1>
        <p>Front + Java + JDBC + MySQL</p>
    </header>
    <main>
        <form action="" id="form-recado">
            <label for="autor">Nome</label>
            <input type="text" id="autor" maxlength="80" required>
            <label for="mensagem">Recado</label>
            <textarea type="text" id="mensagem" name="mensagem" maxlength="255" required></textarea>
        </form>
        <p id="aviso"></p>
        <h2>Recados Publicados</h2>
        <section id="lista-recados"></section>
    </main>
</body>

</html>
